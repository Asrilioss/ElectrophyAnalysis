name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'

      # The install order is load-bearing: ipfx 2.0.0 breaks with numpy >= 1.24,
      # and efel would bump the pynwb that ipfx pins. Same sequence as the README
      # and as build_exe.ps1 — if this job goes green, the documented install
      # instructions still work.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5
          pip install -r requirements.txt -c constraints.txt --prefer-binary
          pip install neo quantities --no-deps
          pip install efel==5.7.17 --no-deps
          pip install pytest

      - name: Check environment coherence
        run: |
          pip check || echo "::warning::pip check reported conflicts (expected for efel/ipfx)"
          python -c "import numpy,scipy,pandas,matplotlib,pyabf,efel,ipfx; print('imports OK, numpy', numpy.__version__)"

      - name: Run the test suite
        run: pytest -v

      # The synthetic validation is the numerical claim of the paper. Running it
      # here means a regression cannot reach a release unnoticed.
      - name: Reproduce the synthetic AUC validation
        run: python validation/auc_validation_v3.py
