# slow_depol.py — example configuration
#
#   python slow_depol.py -i ./data/long_recordings -o ./results -c examples/config_slow_depol.yaml
#
# Command-line flags override anything set here; anything omitted here falls
# back to the built-in default. The values below are the ones used for the
# validation cohort of the accompanying paper — re-tune them for your own
# preparation rather than assuming they transfer.

# --- signal conditioning ---
CUTOFF_HZ: 50               # Gaussian low-pass cutoff (Hz); preserves slow events
IGNORE_FIRST_S: 60          # skip access-resistance / seal-settling artefacts

# --- local sliding baseline ---
BL_WINDOW_S: 7.0            # window width (s). MUST exceed your longest isolated
                            # event: raise to 15-20 s if events run beyond 4-5 s,
                            # otherwise the percentile floor sits above the true RMP
BL_STEP_S: 0.5
BL_PERCENTILE: 10           # lower envelope; robust while events occupy <30 % of a window
BL_TOLERANCE_MV: 1.5        # tolerance for placing the analysis-window boundaries

# --- event detection ---
DEPOL_THRESHOLD_MV: 10      # onset: mV above the LOCAL baseline
DEPOL_END_OFFSET_MV: 0      # offset: strict return to baseline.
                            # Raise toward the threshold (2-5 mV) to split bursts
                            # into sub-events; leave at 0 to merge them.
DEPOL_MIN_DURATION_MS: 30
DVDT_BACK_PTS: 300          # onset-refinement backtrack window (samples)
DVDT_SLOPE_FRAC: 0.3

# --- analysis window ---
ANALYSIS_DURATION_S: null   # null = analyse everything after IGNORE_FIRST_S
ANALYSIS_DURATION_SEARCH_S: 30.0
ANALYZE_AT_MINUTES: [1, 2, 3]

# --- optional changepoint baseline (requires `pip install ruptures`) ---
USE_CHANGEPOINT: false      # enable for recordings with abrupt RMP jumps
CHANGEPOINT_PEN: 10
CHANGEPOINT_SUBSAMPLE: 100
